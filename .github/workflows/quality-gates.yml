name: quality-gates

# Merge-time quality gates, wired as a thin caller of the org's central reusable
# workflows in attested-delivery/.github (pinned by full commit SHA).
#
# Active: pin-check — fails closed on any unpinned `uses:` on push and PR.
#
# Pending one org-side allow-list change (owner action):
#   SAST  (reusable-sast-codeql) and SCA (reusable-sca-osv) both run
#   `github/codeql-action/*`. Calling them currently startup-fails ("workflow
#   file issue"), because `github/codeql-action` is not yet permitted by the org
#   Actions allow-list. Enable it via Org → Settings → Actions → General →
#   "Allow actions created by GitHub" (or add `github/codeql-action@*`), and also
#   confirm the OSV subpath `google/osv-scanner-action/*` is covered. Then
#   uncomment the sast/sca jobs below.
#
# Trivy (container/IaC/license) and Scorecard remain out until their actions
# (aquasecurity/trivy-action, ossf/scorecard-action) are allow-listed too.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pin-check:
    permissions:
      contents: read
    uses: attested-delivery/.github/.github/workflows/pin-check.yml@0e8ba553a55146eddf66e027f157b3cbb294466a

  # sast:

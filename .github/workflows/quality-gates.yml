name: quality-gates

# Merge-time quality gates for the marketing site — thin callers of the org's
# central reusable workflows in attested-delivery/.github (pinned by full commit
# SHA). Each gate normalizes on SARIF and surfaces in the repository Security
# tab; wire "Code scanning results" as a required status check to make it a
# merge gate.
#
# The deploy pipeline (deploy.yml) additionally signs SLSA provenance + a
# CycloneDX SBOM over the published Pages artifact and fail-closed verifies them
# before deploy. Posture (Scorecard) is a repo-level signal and stays here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

jobs:
  pin-check:
    permissions:
      contents: read
    # attested-delivery/.github main @ 698148e (post-#4, 2026-06-19)
    uses: attested-delivery/.github/.github/workflows/pin-check.yml@ca91728c87beb08742325b4ed4d06fcfb261435b

  # SAST: this repo has CodeQL *default setup* enabled (org onboarding standard),
  # which provides SAST and uploads its own SARIF. An *advanced* CodeQL caller
  # cannot coexist with default setup ("advanced configurations cannot be
  # processed when the default setup is enabled"), so SAST is intentionally NOT
  # wired here — default setup covers it. Repos without default setup wire the
  # reusable-sast-codeql caller instead (see attested-pipeline-template).

  sca:
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    # attested-delivery/.github main @ 698148e (post-#4, 2026-06-19)
    uses: attested-delivery/.github/.github/workflows/reusable-sca-osv.yml@ca91728c87beb08742325b4ed4d06fcfb261435b
    with:
      fail-on-severity: high

  posture:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    # attested-delivery/.github main @ 698148e (post-#4, 2026-06-19)
    uses: attested-delivery/.github/.github/workflows/reusable-scorecard.yml@ca91728c87beb08742325b4ed4d06fcfb261435b
    with:
      publish-results: false

  trivy:
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    # attested-delivery/.github main @ 698148e (post-#4, 2026-06-19)
    uses: attested-delivery/.github/.github/workflows/reusable-trivy.yml@ca91728c87beb08742325b4ed4d06fcfb261435b
    with:
      scan-iac: true
